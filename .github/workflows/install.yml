name: Install and build them all !

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: [push]
jobs:
  extract:
    name: Everything !
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup npm
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@26
      - name: Install hyperfine
        run: cargo install --locked hyperfine
      - name: install from scratch
        run: hyperfine --prepare "rm -rf node_modules && rm -rf bun.lock && rm -rf ~/.bun/install/cache && rm -rf pnpm-lock.yaml && pnpm cache delete && rm -rf package-lock.json && npm cache clean --force" --runs 4 "bun install" "pnpm install" "npm install --no-audit --no-fund --loglevel=error"
      - name: ci with node_modules and lockfile
        run: hyperfine "bun install --frozen-lockfile" "pnpm install --frozen-lockfile" "npm ci --no-audit --no-fund --loglevel=error"
      - name: install one package
        run: hyperfine --runs 1 "bun install zod" "pnpm install zod" "npm install zod --no-audit --no-fund --loglevel=error"
      - name: build
        run: hyperfine --runs 1 "bun run build" "pnpm run build" "npm run build" --show-output
